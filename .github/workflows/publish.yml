name: 🚀 Deploy Angular to Hostinger

on:
  push:
    branches:
      - testing  # Cambia esto si tu rama principal tiene otro nombre

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Clonar el repositorio
        uses: actions/checkout@v3

      - name: 🔨 Instalar Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20  # O la versión que uses en tu proyecto

      - name: 📦 Instalar dependencias
        run: npm install

      - name: 🔧 Construir Angular
        run: npm run build -- --configuration=production

      - name: 📡 Subir archivos a Hostinger (FTP)
        uses: SamKirkland/FTP-Deploy-Action@4.3.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/inventario/browser/  # Asegúrate de que es la carpeta correcta
          server-dir: public_html/  # Directorio donde se aloja tu sitio en Hostinger
          dangerous-clean-slate: true  
