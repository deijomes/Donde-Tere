name: 🚀 Deploy Angular to Hostinger

on:
  push:
    branches:
      - testing  # Cambia si usas otra rama

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Clonar el repositorio
        uses: actions/checkout@v3

      - name: 💾 Cache de npm
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: 🔨 Instalar Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20  # O la versión que uses en tu proyecto
          cache: 'npm'

      - name: 📦 Instalar dependencias (usando cache si está disponible)
        run: npm ci  # Usa `npm ci` para instalación limpia y más rápida

      - name: 🔧 Construir Angular
        run: npm run build -- --configuration=production

      - name: 📡 Subir archivos a Hostinger (FTP)
        uses: SamKirkland/FTP-Deploy-Action@4.3.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/inventario/browser/
          server-dir: ./
          
