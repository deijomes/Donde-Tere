name: Deploy to Hostinger

on:
  push:
    branches:
      - testing  # o la rama que uses para producción

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'  # o la versión que uses

      - name: Install dependencies
        run: npm install

      - name: Build Angular app
        run: npm run build --configuration=production
        
      - name: List output files
        run: ls -la dist/

      - name: 📂 Deploy to Hostinger
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: dist/inventario/  # Reemplaza con el nombre de tu app
          server-dir: /public_html/     # o la ruta donde quieres desplegar
          dangerous-clean-slate: true   # Elimina archivos antiguos del servidor