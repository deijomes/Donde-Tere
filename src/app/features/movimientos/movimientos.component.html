<div class="card">
    <div class="p-3 mb-3 fondo">
        <div class="d-flex align-items-center justify-content-between">
            <h4 class="card-title mi-color-letra">Registro de producto</h4>
        </div>
    </div>


    <div class="container padding-lados">
        <div class="row mt-3">

            <div class="col-lg-4">
                <div class="mb-3">
                    <label for="product-code" class="form-label">Código</label>
                    <ng-select [items]="filteredProductos" bindLabel="codigo" bindValue="codigo"
                        placeholder="Seleccione un producto" [searchable]="true" [clearable]="true"
                        [virtualScroll]="true" [loading]="isLoading" (change)="onProductChange($event)" 
                        class="custom-ng-select">
                    </ng-select>
                </div>
                

                
            </div>

            







            <div class="col-lg-4">
                <div class="mb-3">
                    <label for="product-articulo" class="form-label">Articulo</label>
                    <input type="text" id="product-articulo"  class="form-control"
                        placeholder="Nombre del artículo" readonly>
                </div>
            </div>


            <div class="col-lg-4">
                <div class="mb-3">
                    <label for="product-cantidad-inicial" class="form-label">Movimiento</label>
                    <input type="number" id="product-cantidad-inicial" 
                        class="form-control" placeholder="Cantidad inicial">
                </div>
            </div>
        </div>

        <div class="row mt-3">

            <div class="col-lg-4">
                <div class="mb-3">
                    <label for="cantidad-minima" class="form-label">Cantidad</label>
                    <input type="number" id="cantidad-minima" class="form-control"
                        placeholder="Cantidad mínima">
                </div>
            </div>


            <div class="col-lg-4">
                <div class="mb-3">
                    <label for="pv-unitario" class="form-label">Precio unitario</label>
                    <input type="number" id="pv-unitario"  class="form-control"
                        placeholder="Precio  unitario">
                </div>
            </div>


            <div class="col-lg-4">
                <div class="mb-3">
                    <label for="pc-unitario" class="form-label">Total transacción</label>
                    <input type="number" id="pc-unitario"  class="form-control"
                        placeholder="total transacción">
                </div>
            </div>



        </div>
    </div>

    <div class="p-3 bg-light mb-3">
        <div class="row justify-content-end g-2">
            <div class="col-lg-2">
                <a class="btn btn-outline-secondary w-100">Cancelar</a>
            </div>
            <div class="col-lg-2">
                <button type="submit" class="btn btn-primary w-100">Guardar</button>
            </div>
        </div>
    </div>


</div>
