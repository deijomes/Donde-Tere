<!-- Formulario de Registro de Entradas -->
<div class="card " *ngIf="selectedItem === 'Entradas' ">
    <div class="p-3 mb-3 fondo">
        <div class="d-flex align-items-center justify-content-between">
            <h4 class="card-title mi-color-letra">Registro de entradas</h4>
        </div>
    </div>

    <div class=" padding-lado  mb-2 ">

        <form [formGroup]="salidadForm" (ngSubmit)="onSubmitt()" class="row g-2">
            <div class="col-md-5">
                <label for="validationDefault01" class="form-label"></label>
                <input type="text" class="form-control no-bg-placeholder" formControlName="articulo"
                    id="validationDefault01" placeholder="Artículo" required>
            </div>




            <div class="col-md-3">
                <label for="validationDefault02" class="form-label"></label>
                <input type="text" class="form-control no-bg-placeholder" formControlName="codigo"
                    id="validationDefault02" placeholder="Codigo" required>
            </div>

            <div class="col-md-1 d-flex align-items-center">
                <button type="submit" class="btn btn-soft-danger btn-sm mt-3" [disabled]="salidadForm.invalid">
                    <iconify-icon icon="solar:filter-linear" class="align-middle fs-18"></iconify-icon>
                </button>
            </div>
        </form>



        <div *ngIf="filteredProductos.length > 0" class="floating-box">
            <table class="table table-hover table-nowrap table-centered m-0" style="table-layout: fixed; width: 100%;">
              <thead>
                <tr>
                  <th class="text-muted ps-3" style="padding: 4px; padding-left: 8px;">Producto</th> <!-- Ajuste más pequeño -->
                  <th class="text-muted" style="padding: 4px;">Código</th>
                </tr>
              </thead>
              <tbody>
                <tr  *ngFor="let producto of filteredProductos" (click)="onSelectProducto(producto)">
                  <td class="ps-3" style="padding: 4px; display: flex; align-items: center; justify-content: space-between;">
                    <!-- Botón alineado a la izquierda -->
                  
                    <!-- Nombre del producto alineado a la derecha -->
                    <span>{{ producto.articulo }}</span>
                  </td>
                  <td style="padding: 4px;">
                    <span>{{ producto.codigo }}</span>
                  </td>
                  <a class="icon-button" style="height: 50%; display: flex; align-items: center;">
                    <i class='bx bx-select-multiple'></i>
                  </a>
                  
                </tr>
              </tbody>
            </table>
          </div>
          
          
      



    </div>


    <div class="mt-4">

        <form [formGroup]="entradaForm" (ngSubmit)="onSubmit()">
            <div class="container padding-lados">
                <div class="row mt-3">

                    <div class="col-lg-4">
                        <div class="mb-3">
                            <label for="product-articulo" class="form-label">Articulo</label>
                            <input type="text" id="product-articulo" class="form-control"
                                placeholder="Nombre del artículo" formControlName="articulo" readonly />
                        </div>
                    </div>

                    <div class="col-lg-4">
                        <div class="mb-3">
                            <label for="product-articulo" class="form-label">codigo</label>
                            <input type="text" id="product-articulo" class="form-control"
                                placeholder="Nombre del artículo" formControlName="codigo" readonly />
                        </div>
                    </div>

                    <div class="col-lg-4">
                        <div class="mb-3">
                            <label for="product-cantidad-inicial" class="form-label">Movimiento</label>
                            <input type="text" id="product-cantidad-inicial" class="form-control"
                                formControlName="movimiento" placeholder="Cantidad inicial" readonly />
                        </div>
                    </div>
                </div>

                <div class="row mt-2">

                    <div class="col-lg-4">
                        <div class="mb-2">
                            <label for="product-cantidad-inicial" class="form-label">Fecha</label>
                            <input type="date" id="product-cantidad-inicial" class="form-control"
                                formControlName="fecharegistro" placeholder="Cantidad inicial" />
                        </div>
                    </div>


                    <div class="col-lg-4">
                        <div class="mb-3">
                            <label for="cantidad-minima" class="form-label">Cantidad</label>
                            <input type="number" id="cantidad-minima" class="form-control" placeholder="Cantidad"
                                formControlName="cantidad" />
                        </div>
                    </div>

                    <div class="col-lg-4">
                        <div class="mb-3">
                            <label for="pv-unitario" class="form-label">Precio unitario</label>
                            <input type="number" id="pv-unitario" class="form-control" placeholder="Precio unitario"
                                formControlName="precioUnitario" />
                        </div>
                    </div>

                    <div class="col-lg-4 mt-3">
                        <div class="mb-3">
                            <label for="pc-unitario" class="form-label">Total transacción</label>
                            <input type="number" id="pc-unitario" class="form-control" placeholder="Total transacción"
                                formControlName="totalTransaccion" />
                        </div>
                    </div>
                </div>
            </div>

            <div class="p-3 bg-light mb-4">
                <div class="row justify-content-end g-2">
                    <div class="col-lg-2">
                        <button type="submit" class="btn btn-primary w-100" [disabled]="entradaForm.invalid">
                            Guardar
                        </button>
                    </div>
                </div>
            </div>
        </form>

    </div>

</div>

<!-- Formulario de Registro de Salidas -->
<div class="card" *ngIf="selectedItem === 'Salidas'">
    <div class="p-3 mb-3 fondo">
        <div class="d-flex align-items-center justify-content-between">
            <h4 class="card-title mi-color-letra">Registro de salidas</h4>
        </div>
    </div>

    <form [formGroup]="salidadForm" (ngSubmit)="onSubmitt()">
        <div class="container padding-lados">
            <div class="row mt-3">
                <div class="col-lg-4">
                    <div class="mb-3">
                        <label for="product-code" class="form-label">Código</label>
                        <ng-select [items]="filteredProductos" bindLabel="codigo" bindValue="codigo"
                            placeholder="Seleccionar codigo" [searchable]="true" [clearable]="true"
                            [virtualScroll]="true" [loading]="isLoading" formControlName="codigo"
                            class="custom-ng-select">
                        </ng-select>
                    </div>
                </div>

                <div class="col-lg-4">
                    <div class="mb-3">
                        <label for="product-articulo" class="form-label">Articulo</label>
                        <input type="text" id="product-articulo" class="form-control" placeholder="Nombre del artículo"
                            formControlName="articulo" readonly />
                    </div>
                </div>

                <div class="col-lg-4">
                    <div class="mb-3">
                        <label for="product-cantidad-inicial" class="form-label">Movimiento</label>
                        <input type="text" id="product-cantidad-inicial" class="form-control"
                            formControlName="movimiento" placeholder="Cantidad inicial" readonly />
                    </div>
                </div>
            </div>






            <div class="row mt-3">

                <div class="col-lg-4">
                    <div class="mb-3">
                        <label for="product-cantidad-inicial" class="form-label">Fecha </label>
                        <input type="date" id="product-cantidad-inicial" class="form-control" formControlName="fecha"
                            placeholder="Cantidad inicial" />
                    </div>
                </div>

                <div class="col-lg-4">
                    <div class="mb-3">
                        <label for="cantidad-minima" class="form-label">Cantidad</label>
                        <input type="number" id="cantidad-minima" class="form-control" placeholder="Cantidad "
                            formControlName="cantidad" />
                    </div>
                </div>





                <div class="col-lg-4">
                    <div class="mb-3">
                        <label for="pv-unitario" class="form-label">Precio unitario</label>
                        <input type="number" id="pv-unitario" class="form-control" placeholder="Precio unitario"
                            formControlName="precioUnitario" />
                    </div>
                </div>

                <div class="col-lg-4">
                    <div class="mb-3">
                        <label for="pc-unitario" class="form-label">Total transacción</label>
                        <input type="number" id="pc-unitario" class="form-control" placeholder="Total transacción"
                            formControlName="totalTransaccion" />
                    </div>
                </div>
            </div>
        </div>

        <div class="p-3 bg-light mb-3">
            <div class="row justify-content-end g-2">
                <div class="col-lg-2">
                    <button type="submit" class="btn btn-primary w-100" [disabled]="salidadForm.invalid">
                        Guardar
                    </button>
                </div>
            </div>
        </div>
    </form>
</div>
