<div class="col-lg-12">
    <div class="card overflow-hidden">
        <div class="card-body ">
            <div class="bg-primary profile-bg rounded-top position-relative mx-n3 mt-n3 ">
                <img src="assets/images/users/usuario.png" alt=""
                    class="avatar-xl border border-light border-3 rounded-circle position-absolute top-100 start-0 translate-middle ms-5">
            </div>
            <div class="mt-5 d-flex flex-wrap align-items-center justify-content-between mb-2">
                <div>
                    <h4 class="mb-1">{{usuariObtenido}} <i class="bx bxs-badge-check text-success align-middle"></i>
                    </h4>
                    <p class="mb-0">Administrador</p>
                </div>
                <div class="d-flex align-items-center gap-2 my-2 my-lg-0">

                    <a (click)="tablaUser()" class="btn btn-light btn-sm"><iconify-icon icon="solar:eye-broken"
                        class="align-middle fs-18"></iconify-icon></a>
                    <a (click)="regitroUsuariol()" [routerLink]="['register']" routerLinkActive="router-link-active"
                        class="btn btn-outline-primary">
                        <i class="bx bx-plus"></i> Usuario
                    </a>

                </div>
            </div>
        </div>
    </div>




    <div *ngIf="tablaUsuario" id="tab" class="table-responsive pb-3" style="border-radius: 7px;">
        <table class="table align-middle mb-0 table-hover table-centered">
            <thead class="bg-light-subtle">
                <tr>
                    <th class="text-center">Role</th>
                    <th class="text-center">Nombre</th>
                    <th class="text-center">Correo</th>
                    <th>opcion</th>
                </tr>
            </thead>
            <tbody *ngFor="let user of usuariosRegistrados">
                <tr class="border-bottom">
                    <td class="text-center">{{user.role}}</td>
                    <td class="text-center">
                        {{user.fullName}}
                    </td>
                    <td class="text-center"> <span
                            class="badge bg-light-subtle text-muted border py-1 px-2">{{user.email}}</span> </td>

                    <td>
                        <div class="d-flex gap-2">

                            <a (click)="editarUser(user.id)" class="btn btn-soft-primary btn-sm"><iconify-icon
                                    icon="solar:pen-2-broken" class="align-middle fs-18"></iconify-icon></a>

                        </div>
                    </td>



                </tr>








            </tbody>
        </table>
    </div>



    <!-- Este router-outlet es lo más importante para mostrar 'RegistroUsuarioComponent' -->
    <router-outlet></router-outlet>
    <div id="resgistro"></div>
    <div id="edicion"></div>
</div>
