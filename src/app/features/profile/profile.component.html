<div class="col-lg-12">
    <div class="card overflow-hidden">
        <div class="card-body ">
            <div class="bg-primary profile-bg rounded-top position-relative mx-n3 mt-n3 ">
                <img src="assets/images/users/usuario.png" alt=""
                    class="avatar-xl border border-light border-3 rounded-circle position-absolute top-100 start-0 translate-middle ms-5">
            </div>
            <div class="mt-5 d-flex flex-wrap align-items-center justify-content-between mb-2">
                <div>
                    <h4 class="mb-1">{{usuariObtenido}} <i class="bx bxs-badge-check text-success align-middle"></i>
                    </h4>
                    <p class="mb-0">Administrador</p>
                </div>
                <div class="d-flex align-items-center gap-2 my-2 my-lg-0">
                    <a (click)="regitroUsuariol()" [routerLink]="['register']" routerLinkActive="router-link-active"
                        class="btn btn-outline-primary">
                        <i class="bx bx-plus"></i> Usuario
                    </a>
                </div>
            </div>
        </div>
    </div>

    <!-- Este router-outlet es lo más importante para mostrar 'RegistroUsuarioComponent' -->
    <router-outlet></router-outlet>
    <div id="resgistro"></div>
</div>
