<div class="row">
    <div class="col-lg-12">
        <div class="card">
            <div class="card-header">
                <h4 class="card-title">Roles Information</h4>
            </div>
            <div class="card-body">

                <form [formGroup]="actualizarForm" (ngSubmit)="guardarCambios()">

                      <div class="row">
                    <div class="col-lg-6">
                        
                            <div class="mb-3">
                                <label for="roles-name" class="form-label">Nombre</label>
                                <input type="text"  class="form-control" formControlName="fullName" placeholder="Role name"
                                    value="Workspace Manager">
                            </div>
                        
                    </div>
                    <div class="col-lg-6">
                        <div class="mb-3">
                            <label for="roles-name" class="form-label">role</label>
                            <input type="text"  class="form-control" formControlName="role" placeholder=""
                                value="Workspace Manager">
                        </div>
                       
                    </div>
                    <div class="col-lg-6">
                        <div class="mb-3">
                            <label for="roles-name" class="form-label">email</label>
                            <input type="text" class="form-control" formControlName="email" placeholder=""
                                value="Workspace Manager">
                        </div>
                    </div>
                    <div class="col-lg-6">
                        <div class="mb-3">
                            <label for="user-name" class="form-label">password</label>
                            <input type="password" id="user-name" class="form-control" formControlName="password" placeholder=""
                                value="Gaston Lapierre ">
                        </div>
                    </div>
                    <div class="col-lg-6">
                        <p>User Status </p>
                        <div class="d-flex gap-2 align-items-center">
                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="flexRadioDefault"
                                    id="flexRadioDefault1" checked="">
                                <label class="form-check-label" for="flexRadioDefault1">
                                    Active
                                </label>
                            </div>

                        </div>
                    </div>

                </div>

                <div class="card-footer border-top">
                    <button type="submit" class="btn btn-primary">Save Changes</button>
                  </div>


                </form>
              

            </div>
           
        </div>
    </div>
</div>
