<router-outlet></router-outlet>

<div *ngIf="mostrarTabla" class="card">

     <div class="p-2   mb-0 fondo">
          <div class="d-flex align-items-center justify-content-between">
               <h4 class="p-2 card-title mi-color-letra ">Productos registrados</h4>
               <a (click)="registro()" class="btn btn-sm  btn-success me-1"><i class="bx bx-plus"></i> Nuevo
                    Producto</a>

          </div>


     </div>



     <div class="no-padding">
          <div class="table-responsive">
               <table class="table align-middle mb-0 table-hover table-centered">
                    <thead class="bg-light-subtle">
                         <tr>

                              <th class="text-center">Artículo</th>
                              <th class="text-center">Descripcion</th>
                              <th class="text-center">Código</th>
                              <th class="text-center">Categoria</th>
                              <th class="text-center">Precio</th>
                              <th class="text-center">Cantidad</th>
                              <th class=""><iconify-icon icon="solar:settings-bold-duotone"></iconify-icon>Opciones
                              </th>
                         </tr>
                    </thead>
                    <tbody>


                         <tr
                              *ngFor="let producto of productos | paginate: { itemsPerPage: itemsPerPage, currentPage: currentPage }; let i = index">
                              <td class="text-center letra">{{ producto.name }}</td>
                              <td class="text-center">{{ producto.description }}</td>
                              <td class="text-center">{{ producto.code }}</td>
                              <td class="text-center">{{ producto.category }}</td>
                              <td class="text-center">{{ producto.price }}</td>
                              <td class="text-center">{{ producto.quantity }}</td>
                              <td class="text-center">
                                   <div class="d-flex gap-2 ">

                                        <a (click)="edicion(producto.id)"
                                             class="btn btn-soft-danger btn-sm custom-btn"><iconify-icon
                                                  icon="solar:pen-2-broken"
                                                  class="align-middle fs-18"></iconify-icon></a>
                                        <a  (click)="eliminar(producto.id)"  class="btn btn-soft-danger btn-sm"><iconify-icon
                                                  icon="solar:trash-bin-minimalistic-2-broken"
                                                  class="align-middle fs-18"></iconify-icon></a>
                                   </div>
                              </td>
                         </tr>


                    </tbody>
               </table>
          </div>
          <!-- end table-responsive -->
     </div>
     <div class="card-footer border-top">
          <nav aria-label="Page navigation">
            <pagination-controls
              class="pagination justify-content-end mb-0"
              (pageChange)="currentPage = $event"
              previousLabel="Anterior"
              nextLabel="Siguiente"
              [responsive]="true"
              [autoHide]="true">
            </pagination-controls>
          </nav>
        </div>
        

</div>
