<div class="card">

     <div class="p-3  mb-3  fondo">
          <div class="d-flex align-items-center justify-content-between">
               <h4 class="card-title mi-color-letra ">Editando producto</h4>
          </div>
     </div>

     <form [formGroup]="actualizarForm">


          <!-- Resto del formulario sin clases de card -->
          <div class="container padding-lados">
               <div class="row mt-3">
                    <!-- Primera Columna (Articulo) -->
                    <div class="col-lg-4">
                         <div class="mb-3">
                              <label for="product-brand" class="form-label">Artículo</label>
                              <input type="text" id="product-brand" formControlName="name"
                                   (input)="validarCampo('name')" [class.is-invalid]="nombreNovalido()"
                                   class="form-control" placeholder="">
                              <div *ngIf="nombreNovalido()" class="invalid-feedback">
                                   El campo es obligatorio.
                              </div>
                         </div>
                    </div>

                    <!-- Segunda Columna (Código) -->
                    <!-- <div class="col-lg-4">
                        <div class="mb-3">
                             <label for="product-weight" class="form-label">Descripción</label>
                             <input type="text" id="product-weight" formControlName="description"
                                  [class.is-invalid]="codigoNovalido()" class="form-control"
                                  placeholder="Nombre articulo">
                             <div *ngIf="codigoNovalido()" class="">
                                  El es obligatorio.
                             </div>
                        </div>
                   </div> -->
                    <div class="col-lg-4">
                         <div class="mb-3">
                              <label for="small-field" class="form-label">Categoría</label>
                              <input type="text" id="small-field" formControlName="category" class="form-control"
                                   (input)="validarCampo('category')" [class.is-invalid]="categoriaNovalido()" placeholder="">
                              <div *ngIf="categoriaNovalido()" class="invalid-feedback">
                                   El campo es obligatorio.
                              </div>
                         </div>
                    </div>

                    <!-- Tercera Columna (Cantidad Inicial) -->
                    <div class="col-lg-4">
                         <div class="mb-3">
                              <label for="product-weight" class="form-label">Código</label>
                              <input type="text" id="product-weight" formControlName="code" class="form-control"
                              (input)="validarCampo('code')" [class.is-invalid]="codigoNovalido()"
                                   placeholder="">
                                   <div *ngIf="codigoNovalido()" class="invalid-feedback">
                                        El campo es obligatorio.
                                   </div>
                         </div>
                    </div>
               </div>

               <div class="row mt-3">
                    <!-- Primera Columna (Cantidad Mínima) -->


                    <!-- Segunda Columna (Precio de venta unitario) -->
                    <div class="col-lg-4">
                         <div class="mb-3">
                              <label for="small-field" class="form-label">Precio de venta unitario</label>
                              <input type="number" id="small-field" formControlName="price" class="form-control"
                              (input)="validarCampo('price')" [class.is-invalid]="precioNovalido()"
                                   placeholder="">
                                   <div *ngIf="precioNovalido()" class="invalid-feedback">
                                         campo  obligatorio, solo número
                                   </div>
                         </div>
                    </div>

                    <!-- Tercera Columna (Precio de compra unitario) -->
                    <div class="col-lg-4">
                         <div class="mb-3">
                              <label for="small-field" class="form-label">Cantidad</label>
                              <input type="number" id="small-field" formControlName="quantity" class="form-control"
                              (input)="validarCampo('quantity')" [class.is-invalid]="cantidadNovalido()"
                                   placeholder="">
                                   <div *ngIf="cantidadNovalido()" class="invalid-feedback">
                                        campo  obligatorio, solo número
                                  </div>
                         </div>
                         
                    </div>
               </div>
          </div>

          <div class="p-3 bg-light mb-3 ">


               <div class="row justify-content-end g-2">
                    <div class="col-lg-2">
                         <a (click)="cancelar()" class="btn btn-outline-secondary w-100">Cancelar</a>
                    </div>
                    <div class="col-lg-2">
                         <button (click)="actualizarProducto()" type="submit" class="btn btn-primary w-100"
                              [disabled]="actualizarForm.invalid">Editar</button>
                    </div>
               </div>

          </div>
     </form>


     <!-- Tabla para mostrar los productos -->
</div>
