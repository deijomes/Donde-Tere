<div class="card " >
    <div class="p-3 mb-3 fondo">
        <div class="d-flex align-items-center justify-content-between">
            <h4 class="card-title mi-color-letra">Registro de ventas</h4>
        </div>
    </div>

    


    <div class="mt-2">

        <form [formGroup]="saleForm" (ngSubmit)="agregarcantidad()">
            <div class="container padding-lados">
                <div class="row mt-3">
                  
                  
                  <div class="col-lg-6">
                    <div class="mb-3">
                      <label for="product-code" class="form-label">Producto</label>
              
                      <ng-select
                      [items]="filteredProductos"
                      bindLabel="name"
                      bindValue="code"
                      placeholder="Seleccionar producto"
                      [searchable]="true"
                      [clearable]="true"
                      [virtualScroll]="true"
                      formControlName="codigo"
                      class="custom-ng-select"
                      (change)="productoSeleccionado($event)">
                    
                    
                        <!-- Opción personalizada con cabecera (solo una vez) -->
                        <ng-template ng-header-tmp>
                            <table class="table table-sm mb-0">
                              <thead>
                                <tr class="color">
                                  <th>Artículo</th>
                                  <th class="text">Código</th>
                                </tr>
                              </thead>
                            </table>
                          </ng-template>
                          
                          <!-- Opción personalizada para cada producto -->
                          <ng-template ng-option-tmp let-item="item">
                            <table class="table table-sm mb-0">
                              <tbody>
                                <tr>
                                  <td>{{ item.name }}</td>
                                  <td  class="text">{{ item.code }}</td>
                                </tr>
                              </tbody>
                            </table>
                          </ng-template>
                          
                          
              
                      </ng-select>
                    </div>
                  </div>
              
               
                  <div class="col-lg-6">
                    <div class="mb-3">
                      <label for="cantidad-minima" class="form-label">Cantidad</label>
                      <input type="number" id="cantidad-minima" class="form-control no-bg"
                        placeholder="Cantidad" formControlName="cantidad" />
                    </div>
                  </div>
              
                </div>
              </div>
             
              
          
           
            <div class="p-3 bg-light mb-4">
              <div class="row justify-content-end g-2">
                <div class="col-lg-2">
                  <button type="submit" class="btn btn-primary w-100" [disabled]="saleForm.invalid">
                    Agregar
                  </button>
                </div>
              </div>
            </div>
          </form>
          

    </div>

</div>

<div class="no-padding">

    
   
    
    <div class="table-responsive">
         <table class="table align-middle mb-0 table-hover table-centered">
              <thead class="bg-light-subtle">
                   <tr>

                        <th class="text-center">Artículo</th>
                        
                        <th class="text-center">Código</th>
                       
                        <th class="text-center">Precio</th>
                        <th class="text-center">Cantidad</th>
                        <th class=""><iconify-icon icon="solar:settings-bold-duotone"></iconify-icon>Opciones
                        </th>
                   </tr>
              </thead>
              <tbody>


                   <tr
                        *ngFor="let producto of productosSeleccionados">
                        <td class="text-center letra">{{ producto.name }}</td>
                       
                        <td class="text-center">{{ producto.code }}</td>
                      
                        <td class="text-center">{{ producto.price }}</td>
                        <td class="text-center">{{ producto.quantity }}</td>
                        <td class="text-center">
                             <div class="d-flex gap-2 ">

                                  <a 
                                       class="btn btn-soft-danger btn-sm custom-btn"><iconify-icon
                                            icon="solar:pen-2-broken"
                                            class="align-middle fs-18"></iconify-icon></a>
                                  <a   class="btn btn-soft-danger btn-sm"><iconify-icon
                                            icon="solar:trash-bin-minimalistic-2-broken"
                                            class="align-middle fs-18"></iconify-icon></a>
                             </div>
                        </td>
                   </tr>


              </tbody>
         </table>
         <div class="p-3 bg-light mb-4">
            <div class="row justify-content-between g-2">
              <div class="col-lg-8">
                <input type="text" id="cantidad-minima" class="form-control no-bg" placeholder="Cantidad" formControlName="cantidad" />
              </div>
              <div class="col-lg-4 text-end">
                <button (click)="enviarVenta()" type="submit" class="btn btn-primary w-100">
                  Registrar venta
                </button>
              </div>
            </div>
          </div>
          
          
          
      
    </div>
    <!-- end table-responsive -->
</div>
