<body class="h-100">
    <div class="d-flex flex-column h-100 p-3">
        <div class="d-flex flex-column flex-grow-1">
            <div class="row h-100">
                <div class="col-xxl-10">
                    <div class="row justify-content-center h-100">
                        <div class="col-lg-6 py-lg-5 position-relative">

                            <!-- Contenedor flotante -->
                            <div class="floating-box p-4 rounded position-relative pt-5">

                                <!-- Círculo flotante con fondo blanco -->
                                <div class="circle-image position-absolute top-0 start-50 translate-middle"
                                    style="background-color: white; border-radius: 50%; padding: 10px;">
                                    <!-- Imagen ajustada sin cambiar el tamaño del círculo -->
                                    <img src="assets/images/tere4.png" alt="Logo" class="img-fluid rounded-circle"
                                        style="width: 40px; height: 30px;">
                                </div>
                                <div class="d-flex flex-column h-100 justify-content-center">
                                    <div class="mb-5 authentication-form">
                                      <form [formGroup]="registroForm" (ngSubmit)="guardar()">
                                        
                                        <!-- Nombre y Apellido -->
                                        <div class="mb-3">
                                          <label class="form-label" for="new-input">Nombre y Apellido</label>
                                          <input type="text" id="new-input" class="form-control" formControlName="fullName">
                                          
                                          <!-- Validación dinámica para nombre -->
                                          <div *ngIf="fullName?.touched">
                                            <small [ngClass]="{'text-danger': fullName?.invalid, 'text-success': fullName?.valid}">
                                              {{ fullName?.invalid ? 'Primer caracter debe ser mayuscula' : '✔ Válido' }}
                                            </small>
                                          </div>
                                        </div>
                                    
                                        <!-- Email -->
                                        <div class="mb-3">
                                          <label class="form-label" for="example-email">Email</label>
                                          <input type="email" id="example-email" class="form-control" formControlName="email">
                                        </div>
                                    
                                        <!-- Contraseña -->
                                        <div class="mb-3">
                                          <label class="form-label" for="example-password">Contraseña</label>
                                          <input type="password" id="example-password" class="form-control" formControlName="password">
                                          
                                          <!-- Validaciones dinámicas para contraseña -->
                                          <div *ngIf="password?.touched">
                                           
                                            <small [ngClass]="{'text-danger': password?.errors?.['pattern'], 'text-success': !password?.errors?.['pattern']}">
                                              {{ password?.errors?.['pattern'] ? 'Debe incluir mayúsculas, minúsculas, números y símbolos' : '✔ Cumple requisitos de seguridad' }}
                                            </small>
                                          </div>
                                        </div>
                                    
                                        <div class="mb-1 text-center d-grid">
                                          <button class="btn btn-soft-primary" type="submit" [disabled]="registroForm.invalid">Sign Up</button>
                                        </div>
                                      </form>
                                    </div>
                                    
                                    <p class="text-danger text-center">I already have an account 
                                      <a class="text-dark fw-bold ms-1" style="cursor: pointer;">Sign In</a>
                                    </p>
                                    
                                    <div class="col-12 text-center p-4">
                                      <a class="fw-bold footer-text" target="_blank">CorpaTech</a>
                                    </div>
                                  </div>
                                  


                            </div>
                            <!-- Fin contenedor flotante -->
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
